<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLACEMENT</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👀</text></svg>" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0ebe5;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
        }

        /* ── rainbow background layer ── */
        .rainbow-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #f0ebe5;
        }

        .rainbow {
            height: 100vh;
            width: 0;
            top: 0;
            position: absolute;
            transform: rotate(10deg);
            transform-origin: top right;
            will-change: right;
        }

        .h {
            box-shadow: 0 0 50vh 40vh rgba(255, 255, 255, 0.85);
            width: 100vw;
            height: 0;
            bottom: 0;
            left: 0;
            position: absolute;
            pointer-events: none;
        }
        .v {
            box-shadow: 0 0 35vw 25vw rgba(255, 255, 255, 0.80);
            width: 0;
            height: 100vh;
            bottom: 0;
            left: 0;
            position: absolute;
            pointer-events: none;
        }

        @keyframes slide {
            from {
                right: -25vw;
            }
            to {
                right: 125vw;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 32px;
            padding: 32px 36px 44px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* ── Back button row (left aligned, like email-lookup) ── */
        .back-row {
            margin-bottom: 18px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(129, 166, 198, 0.85);
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }
        .back-btn:hover {
            background: #6a8fb0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(129, 166, 198, 0.3);
        }
        .back-btn:active {
            transform: scale(0.97);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0b1a33;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 0 0 4px 0;
        }
        h1 span {
            background: #eef4ff;
            color: #1a5cff;
            font-size: 14px;
            font-weight: 600;
            padding: 2px 16px;
            border-radius: 40px;
        }

        /* ----- Status bar (auto‑load) ----- */
        .status-bar {
            background: #f8faff;
            border: 1px solid #e7eef8;
            border-radius: 14px;
            padding: 14px 22px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .status-bar .label {
            font-weight: 600;
            color: #1f334f;
        }
        .status-bar .msg {
            flex: 1;
            color: #3f5a7a;
            font-size: 14px;
        }
        .status-bar .msg.loading {
            color: #b07a1a;
        }
        .status-bar .msg.success {
            color: #0f3b2c;
        }
        .status-bar .msg.error {
            color: #b13a30;
        }
        .status-bar .badge {
            background: #eef4ff;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
        }
        .status-bar .fallback-btn {
            background: #eef4ff;
            border: 1.5px solid #d0dceb;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #1a5cff;
            transition: 0.2s;
        }
        .status-bar .fallback-btn:hover {
            background: #dce6f2;
        }
        .status-bar input[type="file"] {
            display: none;
        }

        /* ----- Search ----- */
        .search-section {
            background: #f8faff;
            border-radius: 18px;
            padding: 24px 26px 28px;
            border: 1px solid #e7eef8;
            margin-bottom: 24px;
        }
        .search-section label {
            font-weight: 600;
            font-size: 15px;
            color: #0b1a33;
            display: block;
            margin-bottom: 10px;
        }
        .search-section textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #d0dceb;
            border-radius: 14px;
            font-size: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            resize: vertical;
            min-height: 140px;
            line-height: 1.7;
            color: #0b1a33;
        }
        .search-section textarea:focus {
            border-color: #1a5cff;
            box-shadow: 0 0 0 4px rgba(26, 92, 255, 0.08);
        }
        .action-row {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .action-row button {
            padding: 12px 40px;
            background: #1a5cff;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .action-row button:hover {
            background: #0f4ad6;
        }
        .action-row button:active {
            transform: scale(0.97);
        }
        .action-row button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .action-row .stats {
            color: #3f5a7a;
            font-size: 14px;
            font-weight: 500;
            background: #eef4ff;
            padding: 6px 16px;
            border-radius: 40px;
        }
        .action-row .copy-all-btn {
            background: #eef4ff;
            color: #0b1a33;
            border: 1.5px solid #d0dceb;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .action-row .copy-all-btn:hover {
            background: #dce6f2;
            border-color: #1a5cff;
        }
        .action-row .copy-all-btn:active {
            transform: scale(0.97);
        }

        /* ----- Results ----- */
        .results-wrapper {
            border-radius: 16px;
            border: 1px solid #e7eef8;
            overflow: hidden;
            background: #ffffff;
        }
        .results-placeholder {
            padding: 50px 20px;
            text-align: center;
            color: #8da3be;
            font-size: 15px;
        }
        .results-placeholder strong {
            color: #1f334f;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table thead {
            background: #f8faff;
            border-bottom: 2px solid #e7eef8;
        }
        table th {
            text-align: left;
            padding: 14px 18px;
            font-weight: 600;
            color: #1f334f;
            white-space: nowrap;
        }
        table td {
            padding: 13px 18px;
            border-bottom: 1px solid #f0f4fa;
            vertical-align: middle;
            color: #0b1a33;
        }
        table tbody tr:last-child td {
            border-bottom: none;
        }
        table tbody tr:hover {
            background: #fafcff;
        }
        .code-core {
            font-weight: 600;
            font-family: 'Consolas', monospace;
            color: #1a5cff;
            background: #eef4ff;
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            font-size: 13px;
        }
        .input-code {
            font-family: 'Consolas', monospace;
            background: #f4f6fa;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 13px;
            color: #1f334f;
        }
        .badge-bank {
            background: #e6f5ed;
            color: #0f3b2c;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 13px;
            display: inline-block;
        }
        .badge-place {
            background: #f0f3f8;
            color: #1f334f;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 13px;
            display: inline-block;
        }
        .not-found {
            color: #c53a2b;
            font-weight: 600;
            background: #fee9e7;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 13px;
            display: inline-block;
        }
        .row-index {
            color: #8da3be;
            font-weight: 400;
            font-size: 13px;
            text-align: center;
        }
        .copy-row-btn {
            background: transparent;
            border: 1px solid #d0dceb;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #1a5cff;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .copy-row-btn:hover {
            background: #eef4ff;
            border-color: #1a5cff;
        }
        .copy-row-btn.copied {
            background: #e6f5ed;
            color: #0f3b2c;
            border-color: #0f3b2c;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 16px;
            display: none;
        }
        .toast.show {
            display: block;
        }
        .toast.error {
            background: #fee9e7;
            color: #b13a30;
            border: 1px solid #fad7d2;
        }
        .toast.success {
            background: #e6f5ed;
            color: #0f3b2c;
            border: 1px solid #c5e3d4;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px 16px 28px;
            }
            h1 {
                font-size: 20px;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .action-row button {
                width: 100%;
                justify-content: center;
            }
            .action-row .copy-all-btn {
                width: 100%;
                justify-content: center;
            }
            table th,
            table td {
                padding: 10px 12px;
                font-size: 13px;
            }
            .copy-row-btn {
                font-size: 11px;
                padding: 3px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ═══ RAINBOW BACKGROUND ═══ -->
    <div class="rainbow-bg" id="rainbowBg">
        <div class="h"></div>
        <div class="v"></div>
    </div>

    <div class="container">

        <!-- ═══ BACK BUTTON ROW (left aligned, same as email-lookup) ═══ -->
        <div class="back-row">
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <h1>
            👀 PLACEMENT LOOKUP
            <span>Excel</span>
        </h1>

        <!-- Status bar: auto-load + fallback -->
        <div class="status-bar" id="statusBar">
            <span class="label">📂 Status</span>
            <span class="msg" id="statusMsg">⏳ Loading PLACEMENT.xlsx …</span>
            <span class="badge" id="entryCount">—</span>
            <button class="fallback-btn" id="fallbackBtn">⬆️ Manual upload</button>
            <input type="file" id="fallbackInput" accept=".xlsx,.xls" />
        </div>

        <!-- Search -->
        <div class="search-section">
            <label for="codeList">✏️ Enter your CH codes (one per line)</label>
            <textarea id="codeList" placeholder="Input CH CODE please."></textarea>
            <div class="action-row">
                <button id="lookupBtn">🔍 Lookup All</button>
                <span class="stats" id="statsInfo">Waiting for data…</span>
                <button class="copy-all-btn" id="copyAllBtn" title="BANK and PLACEMENT">📋 COPY ALL</button>
            </div>
        </div>

        <!-- Results -->
        <div class="results-wrapper" id="resultsWrapper">
            <div class="results-placeholder" id="placeholder">
                <strong>📋</strong> File will load automatically. Paste your codes and click <strong>Lookup All</strong>.
            </div>
            <div class="table-responsive" id="tableContainer" style="display:none;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Input Code</th>
                            <th>Extracted Core</th>
                            <th>BANK</th>
                            <th>PLACEMENT</th>
                            <th style="text-align:center;">Copy</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ═══ RAINBOW BACKGROUND SCRIPT ═══
        (function() {
            const container = document.getElementById('rainbowBg');
            const length = 25;
            const animationTime = 45;

            const purple = 'rgb(232 121 249)';
            const blue = 'rgb(96 165 250)';
            const green = 'rgb(94 234 212)';

            const perms = [
                [purple, blue, green],
                [purple, green, blue],
                [green, purple, blue],
                [green, blue, purple],
                [blue, green, purple],
                [blue, purple, green]
            ];

            for (let i = 1; i <= length; i++) {
                const el = document.createElement('div');
                el.className = 'rainbow';
                const perm = perms[Math.floor(Math.random() * perms.length)];
                const shadow =
                    `-130px 0 80px 40px white, ` +
                    `-50px 0 50px 25px ${perm[0]}, ` +
                    `0 0 50px 25px ${perm[1]}, ` +
                    `50px 0 50px 25px ${perm[2]}, ` +
                    `130px 0 80px 40px white`;
                el.style.boxShadow = shadow;
                const duration = animationTime - (animationTime / length / 2) * i;
                const delay = -(i / length) * animationTime;
                el.style.animation = `${duration}s linear infinite slide`;
                el.style.animationDelay = `${delay}s`;
                container.insertBefore(el, container.querySelector('.h'));
            }
        })();

        // ═══ PLACEMENT LOOKUP SCRIPT ═══
        (function() {
            'use strict';

            // ----- DOM refs -----
            const statusMsg = document.getElementById('statusMsg');
            const entryCount = document.getElementById('entryCount');
            const fallbackBtn = document.getElementById('fallbackBtn');
            const fallbackInput = document.getElementById('fallbackInput');
            const codeList = document.getElementById('codeList');
            const lookupBtn = document.getElementById('lookupBtn');
            const copyAllBtn = document.getElementById('copyAllBtn');
            const statsInfo = document.getElementById('statsInfo');
            const placeholder = document.getElementById('placeholder');
            const tableContainer = document.getElementById('tableContainer');
            const resultsBody = document.getElementById('resultsBody');
            const toast = document.getElementById('toast');

            let dataMap = new Map();
            let isLoaded = false;
            let currentResults = [];

            // ----- Helpers -----
            function showToast(msg, type = 'error', duration = 4000) {
                toast.textContent = msg;
                toast.className = 'toast show ' + type;
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => { toast.classList.remove('show'); }, duration);
            }

            function extractAlpha(str) {
                return str.replace(/[^A-Z]/gi, '').toUpperCase();
            }

            function setStatus(level, msg, count = null) {
                statusMsg.textContent = msg;
                statusMsg.className = 'msg ' + level;
                if (count !== null) {
                    entryCount.textContent = count;
                } else {
                    entryCount.textContent = count === null ? '—' : count;
                }
            }

            async function copyToClipboard(text, successMsg = 'Copied to clipboard!') {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast(successMsg, 'success', 2000);
                    return true;
                } catch (err) {
                    try {
                        const textarea = document.createElement('textarea');
                        textarea.value = text;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        showToast(successMsg, 'success', 2000);
                        return true;
                    } catch (e2) {
                        showToast('Failed to copy: ' + e2.message, 'error');
                        return false;
                    }
                }
            }

            function parseExcelBuffer(arrayBuffer) {
                try {
                    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    if (!json || json.length < 2) {
                        throw new Error('File is empty or has no data rows.');
                    }

                    const headerRow = json[0];
                    let codeIdx = -1,
                        bankIdx = -1,
                        placementIdx = -1;
                    const headerLower = headerRow.map(h => String(h).trim().toUpperCase());
                    for (let i = 0; i < headerLower.length; i++) {
                        const h = headerLower[i];
                        if (h === 'CODE') codeIdx = i;
                        else if (h === 'BANK') bankIdx = i;
                        else if (h === 'PLACEMENT') placementIdx = i;
                    }
                    if (bankIdx === -1) bankIdx = 1;
                    if (placementIdx === -1) placementIdx = 2;
                    if (codeIdx === -1) codeIdx = 0;

                    const newMap = new Map();
                    for (let r = 1; r < json.length; r++) {
                        const row = json[r];
                        if (!row || row.length === 0) continue;
                        const code = String(row[codeIdx] || '').trim();
                        if (!code) continue;
                        const bank = String(row[bankIdx] || '').trim();
                        const placement = String(row[placementIdx] || '').trim();
                        if (!newMap.has(code)) {
                            newMap.set(code, { bank, placement });
                        }
                    }

                    if (newMap.size === 0) {
                        throw new Error('No valid CODE rows found.');
                    }

                    dataMap = newMap;
                    isLoaded = true;
                    setStatus('success', `✅ Loaded ${dataMap.size} unique entries`, `${dataMap.size} entries`);
                    statsInfo.textContent = `📊 ${dataMap.size} entries ready`;
                    showToast(`Loaded ${dataMap.size} entries successfully`, 'success', 3000);

                    if (codeList.value.trim()) {
                        performBulkLookup();
                    }
                    return true;
                } catch (err) {
                    console.error(err);
                    setStatus('error', '❌ ' + err.message, 'error');
                    showToast('Error reading file: ' + err.message, 'error');
                    return false;
                }
            }

            async function autoLoadExcel() {
                try {
                    setStatus('loading', '⏳ Fetching PLACEMENT.xlsx …', '…');
                    const response = await fetch('PLACEMENT.xlsx');
                    if (!response.ok) {
                        throw new Error(`File not found (HTTP ${response.status}). Place PLACEMENT.xlsx in the same folder.`);
                    }
                    const arrayBuffer = await response.arrayBuffer();
                    parseExcelBuffer(arrayBuffer);
                } catch (err) {
                    console.warn('Auto-load failed:', err);
                    setStatus('error', '⚠️ ' + err.message, 'fallback');
                    showToast('Auto-load failed. Use "Manual upload" to select the file.', 'error');
                }
            }

            function handleManualUpload(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    parseExcelBuffer(e.target.result);
                };
                reader.onerror = function() {
                    showToast('Failed to read the file.', 'error');
                };
                reader.readAsArrayBuffer(file);
                fallbackInput.value = '';
            }

            function performBulkLookup() {
                if (!isLoaded) {
                    showToast('Please wait for the file to load (or upload manually).', 'error');
                    return;
                }

                const raw = codeList.value;
                if (!raw.trim()) {
                    showToast('Please paste at least one CODE.', 'error');
                    return;
                }

                const lines = raw.split('\n').map(s => s.trim()).filter(s => s !== '');
                if (lines.length === 0) {
                    showToast('No valid codes found.', 'error');
                    return;
                }

                const output = [];
                let foundCount = 0;

                for (const input of lines) {
                    const core = extractAlpha(input);
                    if (!core) {
                        output.push({ input, core: '—', bank: null, placement: null, found: false });
                        continue;
                    }

                    const match = dataMap.get(core);
                    if (match) {
                        foundCount++;
                        output.push({ input, core, bank: match.bank, placement: match.placement, found: true });
                    } else {
                        output.push({ input, core, bank: null, placement: null, found: false });
                    }
                }

                currentResults = output;

                placeholder.style.display = 'none';
                tableContainer.style.display = 'block';

                let html = '';
                output.forEach((item, idx) => {
                    const bankDisplay = item.found ? `<span class="badge-bank">${item.bank}</span>` :
                        `<span class="not-found">Not found</span>`;
                    const placeDisplay = item.found ? `<span class="badge-place">${item.placement}</span>` :
                        `<span class="not-found">Not found</span>`;

                    const bankVal = item.found ? item.bank : 'Not found';
                    const placeVal = item.found ? item.placement : 'Not found';

                    html += `
                            <tr>
                                <td class="row-index">${idx + 1}</td>
                                <td><span class="input-code">${item.input}</span></td>
                                <td><span class="code-core">${item.core}</span></td>
                                <td>${bankDisplay}</td>
                                <td>${placeDisplay}</td>
                                <td style="text-align:center;">
                                    <button class="copy-row-btn" 
                                            data-bank="${bankVal.replace(/"/g, '&quot;')}" 
                                            data-placement="${placeVal.replace(/"/g, '&quot;')}"
                                            data-code="${item.input.replace(/"/g, '&quot;')}">
                                        📋 Copy
                                    </button>
                                </td>
                            </tr>
                        `;
                });
                resultsBody.innerHTML = html;

                statsInfo.textContent = `✅ ${foundCount} / ${lines.length} matched`;
                if (foundCount === lines.length) {
                    showToast(`All ${lines.length} codes matched!`, 'success', 3000);
                } else if (foundCount > 0) {
                    showToast(`Found ${foundCount} of ${lines.length} codes.`, 'error', 3000);
                } else {
                    showToast(`No matches for any of the ${lines.length} codes.`, 'error', 3000);
                }
            }

            function copyAllResults() {
                if (!currentResults || currentResults.length === 0) {
                    showToast('No results to copy. Run a lookup first.', 'error');
                    return;
                }

                const lines = currentResults
                    .filter(item => item.found)
                    .map(item => `${item.bank}\t${item.placement}`);

                if (lines.length === 0) {
                    showToast('No matched results to copy.', 'error');
                    return;
                }

                const text = lines.join('\n');
                copyToClipboard(text, `Copied ${lines.length} rows (Bank + Place) ready for Excel!`);
            }

            function copySingleRow(bank, placement, code) {
                const text = `${bank}\t${placement}`;
                copyToClipboard(text, `Copied: ${code} → ${bank} | ${placement}`);
            }

            // ----- Event listeners (delegation for row copy) -----
            resultsBody.addEventListener('click', function(e) {
                const btn = e.target.closest('.copy-row-btn');
                if (!btn) return;

                const bank = btn.getAttribute('data-bank');
                const placement = btn.getAttribute('data-placement');
                const code = btn.getAttribute('data-code');

                btn.textContent = '✅ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = '📋 Copy';
                    btn.classList.remove('copied');
                }, 2000);

                copySingleRow(bank, placement, code);
            });

            fallbackBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                fallbackInput.click();
            });

            fallbackInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) handleManualUpload(file);
            });

            lookupBtn.addEventListener('click', performBulkLookup);

            copyAllBtn.addEventListener('click', copyAllResults);

            codeList.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    performBulkLookup();
                }
            });

            // ----- Start -----
            setStatus('loading', '⏳ Loading PLACEMENT.xlsx …', '…');
            autoLoadExcel();

            console.log('🔍 PLACEMENT LOOKUP ready.');
        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Fixer · UPPERCASE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f5f9;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 2rem 1.5rem;
        }

        .app-wrapper {
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid #eef2f7;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: 'Inter', -apple-system, sans-serif;
            color: #1e2a3a;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #edf1f7;
            padding-bottom: 1rem;
        }

        textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            font-family: 'Inter', 'SF Mono', monospace;
            border: 1px solid #dce2ec;
            border-radius: 1rem;
            background: #fafcff;
            color: #1e2a3a;
            resize: vertical;
            min-height: 150px;
            line-height: 1.7;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #b0bccf;
            background: #ffffff;
        }

        .button-group {
            display: flex;
            gap: 0.6rem;
            margin: 1rem 0 1.8rem 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.5rem 1.6rem;
            border: none;
            border-radius: 40px;
            background: #1e2a3a;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .btn:hover {
            background: #2c3e50;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background: transparent;
            color: #5a6a7e;
            box-shadow: inset 0 0 0 1px #d0d8e3;
            background: #ffffff;
        }

        .btn-outline:hover {
            background: #f0f4fc;
        }

        #status {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: #4f6a7e;
            margin-left: 0.3rem;
        }

        .output-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            color: #5a6a7e;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .output-label .badge {
            background: #eef2f7;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            color: #5a6a7e;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }

        .output-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .output-actions .btn-sm {
            font-size: 0.7rem;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            background: #eef2f7;
            color: #3a4e62;
        }

        .output-actions .btn-sm:hover {
            background: #dce2ec;
        }

        .output-actions .btn-sm.copy-success {
            background: #1a7a5a;
            color: #fff;
        }

        .result-container {
            background: #f8faff;
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid #eef2f7;
            min-height: 80px;
        }

        .result-line {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Georgia', 'Times New Roman', serif;
            line-height: 1.8;
            letter-spacing: 0.02em;
            padding: 0.1rem 0;
            color: #1e2a3a;
        }

        .name-last {
            color: #1e2a3a;
        }

        .name-first {
            color: #3a4e62;
        }

        .empty-state {
            color: #aab5c5;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            font-style: italic;
        }

        @media (max-width: 500px) {
            .app-wrapper {
                padding: 1.2rem;
            }
            .result-container {
                padding: 0.8rem 1rem;
            }
            .result-line {
                font-size: 1rem;
                line-height: 1.6;
            }
            textarea {
                font-size: 0.85rem;
                min-height: 120px;
            }
            .output-label {
                flex-direction: column;
                align-items: flex-start;
            }
            .output-actions {
                width: 100%;
            }
            .output-actions .btn-sm {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <h1>🔤 Name Fixer</h1>

        <textarea id="nameInput" placeholder="Paste names here (one per line)"></textarea>

        <div class="button-group">
            <button class="btn" id="generateBtn">✨ Fix</button>
            <button class="btn btn-outline" id="clearBtn">Clear</button>
            <span id="status"></span>
        </div>

        <div class="output-label">
            <span>▼ Fixed result</span>
            <div class="output-actions">
                <button class="btn-sm" id="copyBtn">📋 Copy All</button>
                <span class="badge">UPPERCASE</span>
            </div>
        </div>
        <div class="result-container" id="resultContainer">
            <div class="empty-state">Paste names above and click Fix</div>
        </div>

    </div>

    <script>
        (function() {
            const textarea = document.getElementById('nameInput');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const container = document.getElementById('resultContainer');
            const status = document.getElementById('status');

            let debounceTimer = null;

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /**
             * Clean text:
             * - Converts Ã± (mojibake) → N
             * - Converts ñ → N
             * - Converts Ñ → N
             * - Also handles common accented letters
             * - Finally converts to UPPERCASE
             */
            function cleanAndUpper(text) {
                let cleaned = text

                    // ─── MOJIBAKE FIX: "Ã±" appears when UTF-8 is misread as Latin-1 ───
                    .replace(/Ã±/g, 'N')

                    // ─── Proper Unicode ñ / Ñ ───
                    .replace(/ñ/g, 'N')
                    .replace(/Ñ/g, 'N')

                    // ─── Common accented vowels (convert to plain) ───
                    .replace(/[áàâä]/g, 'A')
                    .replace(/[ÁÀÂÄ]/g, 'A')
                    .replace(/[éèêë]/g, 'E')
                    .replace(/[ÉÈÊË]/g, 'E')
                    .replace(/[íìîï]/g, 'I')
                    .replace(/[ÍÌÎÏ]/g, 'I')
                    .replace(/[óòôö]/g, 'O')
                    .replace(/[ÓÒÔÖ]/g, 'O')
                    .replace(/[úùûü]/g, 'U')
                    .replace(/[ÚÙÛÜ]/g, 'U')
                    .replace(/[ç]/g, 'C')
                    .replace(/[Ç]/g, 'C');

                return cleaned.toUpperCase();
            }

            /**
             * Smart name splitter:
             * - Handles "First Last" → "LAST, FIRST"
             * - Handles "First Middle Last" → "LAST, FIRST MIDDLE"
             * - Handles "First M.Last" → "LAST, FIRST M."  (like "Raffy O.navarra" → "NAVARRA, RAFFY O.")
             * - Handles "First M. Last" → "LAST, FIRST M."
             * - Handles already comma-separated names
             */
            function splitName(raw) {
                let name = raw.trim();
                if (!name) return null;

                // ─── If it already has a comma ───
                if (name.includes(',')) {
                    const parts = name.split(',').map(s => s.trim());
                    const lastName = parts[0] || '';
                    const firstName = parts.slice(1).join(' ') || '';
                    return { lastName, firstName };
                }

                // ─── No comma — figure it out ───
                const words = name.split(/\s+/).filter(w => w.length > 0);
                if (words.length === 0) return null;
                if (words.length === 1) {
                    return { lastName: words[0], firstName: '' };
                }

                // ─── Check if the last word contains a dot (e.g., "O.navarra") ───
                const lastWord = words[words.length - 1];
                if (lastWord.includes('.')) {
                    // Split by the LAST dot in the word
                    const dotIndex = lastWord.lastIndexOf('.');
                    const beforeDot = lastWord.substring(0, dotIndex);
                    const afterDot = lastWord.substring(dotIndex + 1);

                    // If afterDot is not empty, use it as last name
                    if (afterDot.length > 0) {
                        // Build first name: all words except the last word, plus the part before the dot
                        const firstNameParts = words.slice(0, words.length - 1);
                        if (beforeDot.length > 0) {
                            firstNameParts.push(beforeDot + '.');
                        }
                        const firstName = firstNameParts.join(' ');
                        return { lastName: afterDot, firstName };
                    }
                }

                // ─── Check if the second-to-last word is a single letter with a dot (e.g., "O.") ───
                // This handles "Raffy O. Navarra" → last name = "Navarra", first = "Raffy O."
                if (words.length >= 2) {
                    const secondLast = words[words.length - 2];
                    // Check if it's a single letter followed by a dot (like "O.")
                    if (/^[A-Za-z]\.$/.test(secondLast)) {
                        const lastName = words[words.length - 1];
                        const firstName = words.slice(0, words.length - 1).join(' ');
                        return { lastName, firstName };
                    }
                }

                // ─── Default: last word is last name, everything else is first name ───
                const lastName = words[words.length - 1];
                const firstName = words.slice(0, words.length - 1).join(' ');
                return { lastName, firstName };
            }

            function normalizeName(raw) {
                const parts = splitName(raw);
                if (!parts) return '';

                const { lastName, firstName } = parts;
                const cleanedLast = cleanAndUpper(lastName);
                const cleanedFirst = cleanAndUpper(firstName);

                if (!cleanedFirst) {
                    return `${cleanedLast}, `;
                }
                return `${cleanedLast}, ${cleanedFirst}`;
            }

            function getFixedLines() {
                const raw = textarea.value;
                const lines = raw.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0);

                const results = [];
                lines.forEach(line => {
                    const fixed = normalizeName(line);
                    if (fixed) {
                        results.push(fixed);
                    }
                });
                return results;
            }

            function generateLines() {
                const results = getFixedLines();

                if (results.length === 0) {
                    container.innerHTML = `<div class="empty-state">No names to display</div>`;
                    status.textContent = '';
                    return;
                }

                let html = '';
                results.forEach(fixed => {
                    const match = fixed.match(/^([^,]+),\s*(.*)/);
                    if (match) {
                        const lastName = match[1].trim();
                        const firstName = match[2].trim();
                        html += `
                            <div class="result-line">
                                <span class="name-last">${escapeHtml(lastName)}</span>
                                <span class="name-first">, ${escapeHtml(firstName)}</span>
                            </div>
                        `;
                    } else {
                        html += `<div class="result-line"><span class="name-last">${escapeHtml(fixed)}</span></div>`;
                    }
                });

                container.innerHTML = html;
                status.textContent = `✅ ${results.length} name(s) fixed`;
            }

            function clearAll() {
                textarea.value = '';
                container.innerHTML = `<div class="empty-state">No names to display</div>`;
                status.textContent = '';
                clearTimeout(debounceTimer);
                copyBtn.textContent = '📋 Copy All';
                copyBtn.className = 'btn-sm';
            }

            function copyAll() {
                const results = getFixedLines();

                if (results.length === 0) {
                    copyBtn.textContent = '⚠️ Nothing to copy';
                    copyBtn.className = 'btn-sm';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Copy All';
                        copyBtn.className = 'btn-sm';
                    }, 1500);
                    return;
                }

                const textToCopy = results.join('\n');

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy)
                        .then(() => {
                            copyBtn.textContent = '✅ Copied!';
                            copyBtn.className = 'btn-sm copy-success';
                            setTimeout(() => {
                                copyBtn.textContent = '📋 Copy All';
                                copyBtn.className = 'btn-sm';
                            }, 1800);
                        })
                        .catch(() => {
                            fallbackCopy(textToCopy);
                        });
                } else {
                    fallbackCopy(textToCopy);
                }
            }

            function fallbackCopy(text) {
                const temp = document.createElement('textarea');
                temp.value = text;
                temp.style.position = 'fixed';
                temp.style.left = '-9999px';
                temp.style.top = '0';
                document.body.appendChild(temp);
                temp.select();
                try {
                    document.execCommand('copy');
                    copyBtn.textContent = '✅ Copied!';
                    copyBtn.className = 'btn-sm copy-success';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Copy All';
                        copyBtn.className = 'btn-sm';
                    }, 1800);
                } catch (e) {
                    copyBtn.textContent = '❌ Copy failed';
                    copyBtn.className = 'btn-sm';
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Copy All';
                        copyBtn.className = 'btn-sm';
                    }, 1800);
                }
                document.body.removeChild(temp);
            }

            generateBtn.addEventListener('click', generateLines);
            clearBtn.addEventListener('click', clearAll);
            copyBtn.addEventListener('click', copyAll);

            textarea.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(generateLines, 300);
            });

            textarea.addEventListener('paste', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(generateLines, 80);
            });

            textarea.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    generateLines();
                }
            });

            clearAll();

            textarea.placeholder = 'Paste names here (one per line)';
        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Fixer · UPPERCASE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F3E3D0;
            font-family: -apple-system, "SF Pro", "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1.5rem;
        }

        .app-wrapper {
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 1.5rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 12px 40px rgba(129, 166, 198, 0.12);
            border: 1px solid #D2C4B4;
        }

        .back-row {
            margin-bottom: 1.2rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #81A6C6;
            color: #fff;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        .back-btn:hover {
            background: #6a8fb0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(129, 166, 198, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #D2C4B4;
            padding-bottom: 1rem;
        }

        textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            font-family: inherit;
            border: 1px solid #D2C4B4;
            border-radius: 1rem;
            background: #faf8f5;
            color: #2c3e50;
            resize: vertical;
            min-height: 150px;
            line-height: 1.7;
            transition: border-color 0.2s;
            outline: none;
        }

        textarea:focus {
            border-color: #81A6C6;
            box-shadow: 0 0 0 3px rgba(129, 166, 198, 0.1);
        }

        .button-group {
            display: flex;
            gap: 0.6rem;
            margin: 1rem 0 1.8rem 0;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            font-weight: 500;
            font-size: 0.85rem;
            padding: 0.5rem 1.6rem;
            border: none;
            border-radius: 40px;
            background: #81A6C6;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            font-family: inherit;
        }

        .btn:hover {
            background: #6a8fb0;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background: transparent;
            color: #2c3e50;
            box-shadow: inset 0 0 0 1px #D2C4B4;
            background: #ffffff;
        }

        .btn-outline:hover {
            background: #F3E3D0;
            box-shadow: none;
        }

        #status {
            font-size: 0.8rem;
            color: #5a6f7f;
            margin-left: 0.3rem;
        }

        .output-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #5a6f7f;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .output-label .badge {
            background: #F3E3D0;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            color: #2c3e50;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }

        .output-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .output-actions .btn-sm {
            font-size: 0.7rem;
            padding: 0.25rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            background: #AACDDC;
            color: #2c3e50;
            font-family: inherit;
        }

        .output-actions .btn-sm:hover {
            background: #81A6C6;
            color: #fff;
        }

        .output-actions .btn-sm.copy-success {
            background: #81A6C6;
            color: #fff;
        }

        .result-container {
            background: #faf8f5;
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid #D2C4B4;
            min-height: 80px;
        }

        .result-line {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.8;
            letter-spacing: 0.02em;
            padding: 0.1rem 0;
            color: #2c3e50;
        }

        .name-last {
            color: #2c3e50;
        }

        .name-first {
            color: #5a6f7f;
        }

        .empty-state {
            color: #7a8f9f;
            font-weight: 400;
            font-size: 0.95rem;
            font-style: italic;
        }

        @media (max-width: 500px) {
            .app-wrapper { padding: 1.2rem; }
            .result-container { padding: 0.8rem 1rem; }
            .result-line { font-size: 1rem; }
            textarea { font-size: 0.85rem; min-height: 120px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="back-row">
            <a href="index.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <h1>🔤 Name Fixer</h1>

        <textarea id="nameInput" placeholder="Paste names here (one per line)"></textarea>

        <div class="button-group">
            <button class="btn" id="generateBtn">✨ Fix</button>
            <button class="btn btn-outline" id="clearBtn">Clear</button>
            <span id="status"></span>
        </div>

        <div class="output-label">
            <span>▼ Fixed result</span>
            <div class="output-actions">
                <button class="btn-sm" id="copyBtn">📋 Copy All</button>
                <span class="badge">UPPERCASE</span>
            </div>
        </div>
        <div class="result-container" id="resultContainer">
            <div class="empty-state">Paste names above and click Fix</div>
        </div>

    </div>

    <script>
        (function() {
            const textarea = document.getElementById('nameInput');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const container = document.getElementById('resultContainer');
            const status = document.getElementById('status');

            let debounceTimer = null;

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function cleanAndUpper(text) {
                let cleaned = text
                    .replace(/Ã±/g, 'N')
                    .replace(/ñ/g, 'N')
                    .replace(/Ñ/g, 'N')
                    .replace(/[áàâä]/g, 'A')
                    .replace(/[ÁÀÂÄ]/g, 'A')
                    .replace(/[éèêë]/g, 'E')
                    .replace(/[ÉÈÊË]/g, 'E')
                    .replace(/[íìîï]/g, 'I')
                    .replace(/[ÍÌÎÏ]/g, 'I')
                    .replace(/[óòôö]/g, 'O')
                    .replace(/[ÓÒÔÖ]/g, 'O')
                    .replace(/[úùûü]/g, 'U')
                    .replace(/[ÚÙÛÜ]/g, 'U')
                    .replace(/[ç]/g, 'C')
                    .replace(/[Ç]/g, 'C');
                return cleaned.toUpperCase();
            }

            function splitName(raw) {
                let name = raw.trim();
                if (!name) return null;
                if (name.includes(',')) {
                    const parts = name.split(',').map(s => s.trim());
                    return { lastName: parts[0] || '', firstName: parts.slice(1).join(' ') || '' };
                }
                const words = name.split(/\s+/).filter(w => w.length > 0);
                if (words.length === 0) return null;
                if (words.length === 1) return { lastName: words[0], firstName: '' };

                const lastWord = words[words.length - 1];
                if (lastWord.includes('.')) {
                    const dotIndex = lastWord.lastIndexOf('.');
                    const beforeDot = lastWord.substring(0, dotIndex);
                    const afterDot = lastWord.substring(dotIndex + 1);
                    if (afterDot.length > 0) {
                        const firstNameParts = words.slice(0, words.length - 1);
                        if (beforeDot.length > 0) firstNameParts.push(beforeDot + '.');
                        return { lastName: afterDot, firstName: firstNameParts.join(' ') };
                    }
                }

                if (words.length >= 2) {
                    const secondLast = words[words.length - 2];
                    if (/^[A-Za-z]\.$/.test(secondLast)) {
                        return { lastName: words[words.length - 1], firstName: words.slice(0, words.length - 1).join(' ') };
                    }
                }

                return { lastName: words[words.length - 1], firstName: words.slice(0, words.length - 1).join(' ') };
            }

            function normalizeName(raw) {
                const parts = splitName(raw);
                if (!parts) return '';
                const { lastName, firstName } = parts;
                const cleanedLast = cleanAndUpper(lastName);
                const cleanedFirst = cleanAndUpper(firstName);
                if (!cleanedFirst) return `${cleanedLast}, `;
                return `${cleanedLast}, ${cleanedFirst}`;
            }

            function getFixedLines() {
                return textarea.value.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => normalizeName(line))
                    .filter(fixed => fixed);
            }

            function generateLines() {
                const results = getFixedLines();
                if (results.length === 0) {
                    container.innerHTML = `<div class="empty-state">No names to display</div>`;
                    status.textContent = '';
                    return;
                }
                let html = '';
                results.forEach(fixed => {
                    const match = fixed.match(/^([^,]+),\s*(.*)/);
                    if (match) {
                        html += `<div class="result-line"><span class="name-last">${escapeHtml(match[1].trim())}</span><span class="name-first">, ${escapeHtml(match[2].trim())}</span></div>`;
                    } else {
                        html += `<div class="result-line"><span class="name-last">${escapeHtml(fixed)}</span></div>`;
                    }
                });
                container.innerHTML = html;
                status.textContent = `✅ ${results.length} name(s) fixed`;
            }

            function clearAll() {
                textarea.value = '';
                container.innerHTML = `<div class="empty-state">No names to display</div>`;
                status.textContent = '';
                clearTimeout(debounceTimer);
                copyBtn.textContent = '📋 Copy All';
                copyBtn.className = 'btn-sm';
            }

            function copyAll() {
                const results = getFixedLines();
                if (results.length === 0) {
                    copyBtn.textContent = '⚠️ Nothing to copy';
                    copyBtn.className = 'btn-sm';
                    setTimeout(() => { copyBtn.textContent = '📋 Copy All'; copyBtn.className = 'btn-sm'; }, 1500);
                    return;
                }
                const textToCopy = results.join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(textToCopy)
                        .then(() => {
                            copyBtn.textContent = '✅ Copied!';
                            copyBtn.className = 'btn-sm copy-success';
                            setTimeout(() => { copyBtn.textContent = '📋 Copy All'; copyBtn.className = 'btn-sm'; }, 1800);
                        })
                        .catch(() => fallbackCopy(textToCopy));
                } else {
                    fallbackCopy(textToCopy);
                }
            }

            function fallbackCopy(text) {
                const temp = document.createElement('textarea');
                temp.value = text;
                temp.style.position = 'fixed';
                temp.style.left = '-9999px';
                temp.style.top = '0';
                document.body.appendChild(temp);
                temp.select();
                try {
                    document.execCommand('copy');
                    copyBtn.textContent = '✅ Copied!';
                    copyBtn.className = 'btn-sm copy-success';
                    setTimeout(() => { copyBtn.textContent = '📋 Copy All'; copyBtn.className = 'btn-sm'; }, 1800);
                } catch (e) {
                    copyBtn.textContent = '❌ Copy failed';
                    copyBtn.className = 'btn-sm';
                    setTimeout(() => { copyBtn.textContent = '📋 Copy All'; copyBtn.className = 'btn-sm'; }, 1800);
                }
                document.body.removeChild(temp);
            }

            generateBtn.addEventListener('click', generateLines);
            clearBtn.addEventListener('click', clearAll);
            copyBtn.addEventListener('click', copyAll);

            textarea.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(generateLines, 300);
            });
            textarea.addEventListener('paste', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(generateLines, 80);
            });
            textarea.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    generateLines();
                }
            });

            clearAll();
            textarea.placeholder = 'Paste names here (one per line)';
        })();
    </script>

</body>
</html>
